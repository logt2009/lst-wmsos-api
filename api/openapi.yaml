openapi: 3.0.3
info:
  title: Servicio de Stock Lógico
  version: 1.0.0
  description: API para gestionar el modelo lógico de stock en un almacén.
  termsOfService: https://example.com/terms
  contact:
    name: Equipo de Desarrollo
    url: https://example.com/contact
    email: support@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://api.stocklogical/v1

# Definición de esquemas de seguridad
components:
  securitySchemes:
    oauth2_scheme:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://example.com/oauth/authorize
          tokenUrl: https://example.com/oauth/token
          scopes:
            zones:read: Permite leer información sobre zonas.
            zones:write: Permite crear o modificar zonas.
            positions:read: Permite leer información sobre posiciones.
            positions:write: Permite crear o modificar posiciones.
            stock:read: Permite leer información sobre stock.
            stock:write: Permite crear o modificar stock.
            state:change: Permite cambiar el estado de posiciones o zonas.

# Aplicación global de seguridad (opcional)
security:
  - oauth2_scheme:
      - zones:read
      - positions:read
      - stock:read

paths:
  /zones:
    post:
      summary: Crear una nueva zona
      operationId: createZone
      security:
        - oauth2_scheme:
            - zones:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Zone'
      responses:
        '201':
          description: Zona creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'

  /zones/{zoneId}:
    get:
      summary: Obtener detalles de una zona
      operationId: getZone
      security:
        - oauth2_scheme:
            - zones:read
      parameters:
        - name: zoneId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Zona encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'

  /positions:
    post:
      summary: Crear una nueva posición
      operationId: createPosition
      security:
        - oauth2_scheme:
            - positions:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Position'
      responses:
        '201':
          description: Posición creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'

  /positions/{positionId}:
    get:
      summary: Obtener detalles de una posición
      operationId: getPosition
      security:
        - oauth2_scheme:
            - positions:read
      parameters:
        - name: positionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Posición encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Position'

  /stock:
    post:
      summary: Registrar nuevo stock
      operationId: registerStock
      security:
        - oauth2_scheme:
            - stock:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stock'
      responses:
        '201':
          description: Stock registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'

  /stock/{sku}:
    get:
      summary: Obtener detalles de un SKU
      operationId: getStockBySKU
      security:
        - oauth2_scheme:
            - stock:read
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Stock encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stock'

  /change-state:
    post:
      summary: Cambiar el estado de posiciones o zonas
      operationId: changeStateopenapi: 3.0.3
